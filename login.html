<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="assets/img/logo.png">
  <title>Login — Boba Bliss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-row" style="justify-content: flex-end;">
    <div class="header-actions" style="display: flex; gap: 8px;">
      <button class="icon-btn theme-toggle" data-theme-toggle aria-label="Toggle dark mode"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
      <button class="icon-btn" id="rtl-toggle" aria-label="Toggle RTL"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"></path><path d="M3 7h18"></path><path d="M7 21l-4-4 4-4"></path><path d="M21 17H3"></path></svg></button>
    </div>
  </div>
</header>





<section class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="auth-logo" style="text-decoration:none; color:inherit; display:flex; justify-content:center; align-items:center;">
        <img src="assets/img/logo.png" alt="Logo" style="width: 56px; height: 56px; margin-right: 12px; object-fit: contain;"> Boba Bliss
      </a>
      <div class="auth-overline">WELCOME BACK</div>
      <h1 class="auth-title">Sign in to Boba Bliss</h1>
      <p class="auth-desc">Manage subscriptions, track orders and save your favorite boba blends.</p>
    </div>

    <form class="auth-form" id="login-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" required placeholder="you@example.com">
        <span class="err-msg">Please enter a valid email.</span>
      </div>
      <div class="field">
        <label for="password">
          Password
          <a href="#">Forgot password?</a>
        </label>
        <input type="password" id="password" required placeholder="••••••••">
        <span class="err-msg">Please enter your password.</span>
      </div>
      
      <label class="auth-check">
        <input type="checkbox" checked>
        <span>Keep me signed in</span>
      </label>

      <button type="submit" class="btn btn-primary btn-block" style="display:flex; justify-content:center; gap:8px;">Sign In <span>→</span></button>
      <p class="form-success" style="display:none; margin-top:14px; text-align:center; color:var(--matcha); font-weight:700;">Login successful! Redirecting...</p>
    </form>

    <div class="auth-divider">or continue with</div>

    <div class="auth-social">
      <button class="btn-social">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12.545 10.239v3.821h5.445c-.712 2.315-2.662 3.269-5.445 3.269-3.235 0-5.91-2.483-5.91-5.91s2.675-5.91 5.91-5.91c1.558 0 2.87.566 3.86 1.488l2.791-2.791C17.433 2.502 15.228 1.4 12.545 1.4 6.702 1.4 2 6.102 2 11.945s4.702 10.545 10.545 10.545c6.079 0 10.158-4.275 10.158-10.355 0-.712-.089-1.398-.222-2.073h-9.936z"/></svg>
        Google
      </button>
      <button class="btn-social">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.09 2.31-.86 3.59-.8 1.51.05 2.81.72 3.67 1.84-3.04 1.77-2.54 5.92.51 7.07-.71 1.77-1.57 3.32-2.85 4.06zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        Apple
      </button>
    </div>
    
    <div style="text-align: center; margin-top: 32px; font-size: 0.9rem;">
      <a href="register.html" style="color: var(--text-soft); font-weight: 500;">Don't have an account? <span style="color: var(--accent); text-decoration: underline;">Sign up</span></a>
    </div>
  </div>
</section>

<script src="assets/js/main.js"></script>
  <script src="assets/js/advanced_animations.js"></script>
</body>
</html>
